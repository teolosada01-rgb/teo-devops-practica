server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Peticiones a la API: /api/productos -> http://api:8000/productos
    # "api" es el nombre del servicio en docker-compose.yml, Docker lo
    # resuelve a la IP del contenedor de la API dentro de su red interna.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
